<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <title>LOGIN</title>
    </head>
    <body>
        <main>
            <div class="container">
                <section class="card glass">
                    <h1 class="title">LOGIN</h1>
                    <article class="perfil">
                        <div class="ft"></div>
                    </article>

                    <article class="data">
                        <form id="info">
                            <div class="div-info">
                                <label for="ipt-email"><i class="fa-regular fa-envelope"></i></label>
                                <input type="email" placeholder="Digite seu email" id="ipt-email" class="text" required>
                                <span class="erro" style="color:red; display: none;">email errado</span>
                            </div>
                            <div class="div-info">
                                <label for="ipt-senha"><i class="fa-solid fa-unlock"></i></label>
                                <input type="password" placeholder="Digite sua senha" id="ipt-senha" class="text" required>
                                <span class="erro" style="color:red; display: none;">senha errada</span>
                            </div>
                        </form>

                        <div class="info-bottom">
                            <div>
                                <input type="checkbox" name="lembrar" id="check-bx">
                                <label for="check-bx">Lembrar senha?</label>
                            </div>
                            <a href="cadastro.html">Não tem cadastro?</a>
                        </div>
                    </article>
                    <button id="btn-login" class="btn glass" type="submit" form="info">ENTRAR</button>
                </section>
            </div>
        </main>
    </body>
    <script src="script.js"></script>
</html>
